# Production: `docker compose up -d --build`. Settings: ./.env (compose) + ./src/LeadIntel/.env (app). See docs/DEPLOY.md.
services:
  db:
    image: postgres:18-alpine  # same major as local dev, so dumps restore cleanly
    restart: unless-stopped
    environment:
      POSTGRES_DB: leadintel
      POSTGRES_USER: leadintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql]  # postgres 18+ layout
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "leadintel"]
      interval: 5s
      retries: 20

  # Dashboard + API. Every COLLECT_EVERY_HOURS it also collects, enriches, writes AI briefs, sends Telegram alerts
  # and the FMCSA daily-decisions Excel (in-process scheduler).
  app:
    build: .
    restart: unless-stopped
    env_file: ./src/LeadIntel/.env
    environment:
      DATABASE_URL: Host=db;Database=leadintel;Username=leadintel;Password=${POSTGRES_PASSWORD}
      FRONTEND_ORIGIN: ${SITE_ADDRESS}
      COLLECT_EVERY_HOURS: ${COLLECT_EVERY_HOURS:-6}
    volumes:
      - keys:/home/app/.aspnet
      - reports:/app/reports
    depends_on:
      db: {condition: service_healthy}

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]

  # Daily compressed dump, 14 kept, in ./backups on the host.
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: [./backups:/backups]
    depends_on:
      db: {condition: service_healthy}
    command: ["sh", "-c", "while true; do pg_dump -h db -U leadintel leadintel | gzip > /backups/leadintel-$$(date +%F).sql.gz && ls -1t /backups/*.sql.gz | tail -n +15 | xargs -r rm; sleep 24h; done"]

volumes:
  pgdata:
  caddy_data:
  keys:
  reports:
